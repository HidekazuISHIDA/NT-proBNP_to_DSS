[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ntprobnp-dss"
version = "0.1.0"
description = "Decision-tree DSS to triage NT-proBNP >300 using routine labs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "matplotlib",
  "shap",
  "joblib",
  "pyyaml",
  "rich",
]

[tool.setuptools.packages.find]
where = ["src"]
